{% extends 'blog/base.html' %}

{% block content %}

<h2>{{ post.title }}</h2>

<p>
    <strong>Author:</strong> {{ post.author }}
</p>

<p>
    <strong>Date:</strong> {{ post.created_at|date:"Y/m/d" }}
</p>

<hr>

<p>
    {{ post.content }}
</p>

<p>
    <strong>Category:</strong>
    {{ post.category }}
</p>

<p>
    <strong>Tags:</strong>

    {% for tag in post.tags.all %}
        {{ tag.name }}
    {% empty %}
        No tags
    {% endfor %}

</p>

{% endblock %}
