<!DOCTYPE html>
<html>

<head>
    <title>My Blog</title>
</head>

<body>

    <h1>My Django Blog</h1>

    <hr>

    <nav>

    <a href="{% url 'home' %}">Home</a>

    |

    {% if user.is_authenticated %}

        Hello {{ user.username }}

        |

        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

    {% endif %}

</nav>

<hr>



    {% block content %}

    {% endblock %}

</body>

</html>
