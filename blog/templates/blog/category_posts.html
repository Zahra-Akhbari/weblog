{% extends 'blog/base.html' %}

{% block content %}

<h2>Category: {{ category.name }}</h2>

<hr>

{% for post in posts %}

    <h3>

        <a href="{% url 'post_detail' post.slug %}" class="text-decoration-none">

            {{ post.title }}

        </a>

    </h3>

{% empty %}

    <p>No posts found.</p>

{% endfor %}

{% endblock %}
